name: Download Itch.io Games

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      game_url:
        description: 'Itch.io game URL'
        required: true
        default: 'https://baraklava.itch.io/manic-miners'
      platform:
        description: 'Platform (windows, linux, mac, android, or leave empty for auto)'
        required: false
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install itchio-downloader
        run: npm install -g itchio-downloader
      
      - name: Create downloads directory
        run: mkdir -p downloads
      
      - name: Download game to repo
        run: |
          if [ -z "${{ github.event.inputs.platform }}" ]; then
            itchio-downloader --url "${{ github.event.inputs.game_url }}" --downloadDirectory ./downloads
          else
            itchio-downloader --url "${{ github.event.inputs.game_url }}" --platform "${{ github.event.inputs.platform }}" --downloadDirectory ./downloads
          fi
      
      - name: Commit and push downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git diff --staged --quiet || git commit -m "Download game from ${{ github.event.inputs.game_url }}"
          git push
