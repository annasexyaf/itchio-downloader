name: Download Itch.io Games

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Itch.io game URL'
        required: true
        default: 'https://baraklava.itch.io/manic-miners'
      platform:
        description: 'Platform (windows, linux, osx)'
        required: false
        default: 'windows'
      use_api_key:
        description: 'Use API key? (paste key in next field if yes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      api_key:
        description: 'Your itch.io API key (if needed)'
        required: false
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install itchio-downloader
        run: npm install -g itchio-downloader
      
      - name: Create downloads directory
        run: mkdir -p downloads
      
      - name: Download game with platform and API key
        env:
          ITCH_API_KEY: ${{ github.event.inputs.api_key }}
        run: |
          if [ "${{ github.event.inputs.use_api_key }}" = "true" ]; then
            itchio-downloader \
              --url "${{ github.event.inputs.game_url }}" \
              --platform "${{ github.event.inputs.platform }}" \
              --apiKey "${{ github.event.inputs.api_key }}" \
              --downloadDirectory ./downloads
          else
            itchio-downloader \
              --url "${{ github.event.inputs.game_url }}" \
              --platform "${{ github.event.inputs.platform }}" \
              --downloadDirectory ./downloads
          fi
      
      - name: List downloaded files (debug)
        run: |
          echo "=== Contents of downloads/ ==="
          ls -la downloads/
          echo ""
          echo "=== Finding game files (non-JSON) ==="
          find downloads/ -type f ! -name "*.json" | head -20
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git diff --staged --quiet || git commit -m "Download game from ${{ github.event.inputs.game_url }}"
          git push
