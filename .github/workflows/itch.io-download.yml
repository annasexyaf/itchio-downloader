name: Download Itch.io Game

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Itch.io game URL'
        required: true
        type: string
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          # Track zip files with LFS
          git lfs track "*.zip"
          git lfs track "*.rar"
          git lfs track "*.7z"
          git lfs track "*.exe"
          git lfs track "*.apk"
          git add .gitattributes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install itchio-downloader CLI
        run: npm install -g itchio-downloader

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Download game directly to downloads folder
        run: |
          itchio-downloader --url "${{ github.event.inputs.game_url }}" --downloadDirectory ./downloads

      - name: List downloaded files
        run: |
          echo "Files in downloads directory:"
          ls -la downloads/

      - name: Commit and push downloaded files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .gitattributes
          git add downloads/
          git commit -m "Add downloaded game files" || echo "No changes to commit"
          git push
