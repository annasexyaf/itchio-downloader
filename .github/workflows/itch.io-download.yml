name: Download Itch.io Game

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Itch.io game URL'
        required: true
        type: string
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract game ID from URL
        id: extract
        run: |
          # Extract the game ID from the URL (everything after itch.io/)
          GAME_URL="${{ github.event.inputs.game_url }}"
          # Remove trailing slash if present
          GAME_URL="${GAME_URL%/}"
          # Get the last part of the URL
          GAME_ID=$(echo "$GAME_URL" | awk -F'/' '{print $NF}')
          echo "Extracted game ID: $GAME_ID"
          echo "game_id=$GAME_ID" >> $GITHUB_OUTPUT

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Download game from Itch.io
        uses: Wal33D/itchio-downloader@main
        with:
          itch-game-id: ${{ steps.extract.outputs.game_id }}
          
      - name: Move downloaded files to downloads folder
        run: |
          # Move all files and folders except .git, workflow files, and downloads itself
          for item in *; do
            if [ "$item" != "downloads" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              mv "$item" downloads/ 2>/dev/null || true
            fi
          done

      - name: List downloaded files
        run: |
          echo "Files in downloads directory:"
          ls -la downloads/

      - name: Commit and push downloaded files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add downloads/
          git commit -m "Add downloaded game files from ${{ steps.extract.outputs.game_id }}" || echo "No changes to commit"
          git push
