name: Download itch.io Game

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'itch.io game URL'
        required: true
        type: string
      
      platform:
        description: 'Target Platform'
        required: true
        type: choice
        options:
          - windows
          - mac
          - linux
          - android
        default: 'windows'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Download game
        run: |
          python itch-downloader.py "${{ github.event.inputs.game_url }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --output ./downloads
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ github.event.inputs.platform }}
          path: downloads/*
