name: Download Itch.io Game

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Download game from Itch.io
        uses: Wal33D/itchio-downloader@main
        with:
          itch-game-id: ${{ secrets.ITCH_GAME_ID }}
          
      - name: Move downloaded files to downloads folder
        run: |
          # Move all files and folders except .git, workflow files, and downloads itself
          for item in *; do
            if [ "$item" != "downloads" ] && [ "$item" != ".git" ] && [ "$item" != ".github" ]; then
              mv "$item" downloads/ 2>/dev/null || true
            fi
          done

      - name: List downloaded files
        run: |
          echo "Files in downloads directory:"
          ls -la downloads/

      - name: Commit and push downloaded files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add downloads/
          git commit -m "Add downloaded game files from Itch.io" || echo "No changes to commit"
          git push
